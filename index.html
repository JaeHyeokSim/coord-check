<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>좌표 체크리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 상단 고정 진행바 + 번호별 카드 그리드, 각 카드 안에 X/Y/체크 표 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#1d2422; --muted:#6a7672; --line:#d9dfdc;
  --accent:#1f7a5c; --accent-soft:#dff0e8; --done-row:#eef7f2;
  --sans:"Noto Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1b201f; --fg:#e4ebe8; --muted:#8e9a96; --line:#2c3431;
  --accent:#4fc39a; --accent-soft:#1d3a2f; --done-row:#18302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1b201f; --fg:#e4ebe8; --muted:#8e9a96; --line:#2c3431;
  --accent:#4fc39a; --accent-soft:#1d3a2f; --done-row:#18302a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
h1{font-size:20px;margin:0;font-weight:700}
.total{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,label.tg{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover,label.tg:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.danger{color:#c0392b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.card.complete{border-color:var(--accent)}
.card h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);gap:8px}
.card h2 .chip{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.card.complete h2 .chip{background:var(--accent-soft);color:var(--accent)}
.card h2 .acts{display:flex;gap:6px;align-items:center}
.card h2 button{padding:2px 8px;font-size:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th.c,td.c{text-align:center;width:28px}
td{padding:4px;text-align:right;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.sep,th.sep{border-left:1px solid var(--line)}
td.pt{cursor:pointer;user-select:none}
td.pt.on{background:var(--done-row);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
td.c.on{background:var(--done-row)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;margin:0}
.dup{font-size:11px;font-weight:400;color:var(--muted)}
body.hide-done .card.complete{display:none}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who input[type=text]{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 10px;width:140px}
#syncStat.err{color:#c0392b}
.hint{margin:24px 0 0;color:var(--muted)}
body:not(.ready) .grid,body:not(.ready) .total,body:not(.ready) .tools{display:none}
body.ready .hint{display:none}
</style>
<style>*{box-sizing:border-box}body{margin:0;font-size:14px}</style>
</head>
<body>

<header>
  <h1>좌표 체크리스트</h1>
  <form class="who" id="nickForm">
    <input type="text" id="nick" placeholder="닉네임" maxlength="20" autocomplete="off" aria-label="닉네임">
    <button type="submit">불러오기</button>
    <span class="num" id="syncStat"></span>
  </form>
  <div class="total"><div class="bar"><i id="totalBar"></i></div><span class="num" id="totalNum">0 / 0</span></div>
  <div class="tools">
    <label class="tg"><input type="checkbox" id="hideDone"> 완료된 번호 숨기기</label>
    <button id="resetAll" class="danger">전체 초기화</button>
  </div>
</header>
<p class="hint">닉네임을 입력하고 불러오기를 누르면 체크 상태가 닉네임별로 저장됩니다.</p>

/* Firebase Realtime Database 주소. 비우면 이 브라우저에만 닉네임별 저장.
   예: "https://프로젝트ID-default-rtdb.asia-southeast1.firebasedatabase.app" */
const DB_URL="";
const KEY="coordCheck.v1";            // 닉네임 도입 전 저장값(1회 이관 후 삭제)
const NICK_KEY="coordCheck.nick";
const CACHE=n=>"coordCheck.u."+n;
let nick="",state={},pending={},timer=null,reqSeq=0;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const parse=s=>{try{return JSON.parse(s)||{}}catch(e){return {}}};
const isEmpty=o=>!Object.keys(o).length;
const statEl=document.getElementById("syncStat");
function stat(t,err){statEl.textContent=t;statEl.classList.toggle("err",!!err)}
function dbUrl(){return DB_URL.replace(/\/+$/,"")+"/coordCheck/"+encodeURIComponent(nick)+".json"}
function cache(){lsSet(CACHE(nick),JSON.stringify(state))}

function mark(id,on){
  if(on)state[id]=1;else delete state[id];
  pending[id]=on?1:null;cache();
  if(!DB_URL){pending={};stat("이 브라우저에 저장됨");return}
  stat("저장 중…");clearTimeout(timer);timer=setTimeout(flush,400);
}
async function flush(){
  const body=pending;pending={};if(isEmpty(body))return;
  try{
    const r=await fetch(dbUrl(),{method:"PATCH",body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status);
    if(isEmpty(pending))stat("저장됨");
  }catch(e){
    Object.keys(body).forEach(k=>{if(!(k in pending))pending[k]=body[k]});
    stat("저장 실패, 재시도 중",1);clearTimeout(timer);timer=setTimeout(flush,3000);
  }
}
async function load(n){
  nick=n;lsSet(NICK_KEY,n);pending={};clearTimeout(timer);
  state=parse(lsGet(CACHE(n)));
  const legacy=parse(lsGet(KEY));
  if(isEmpty(state)&&!isEmpty(legacy)){state=legacy;cache();lsDel(KEY)}
  document.body.classList.add("ready");refresh();
  if(!DB_URL){stat("이 브라우저에 저장됨");return}
  const seq=++reqSeq;stat("불러오는 중…");
  try{
    const r=await fetch(dbUrl());if(!r.ok)throw new Error(r.status);
    const d=await r.json();if(seq!==reqSeq)return;
    if(d==null&&!isEmpty(state)){                // 서버에 없고 로컬 기록만 있으면 올림
      await fetch(dbUrl(),{method:"PUT",body:JSON.stringify(state)});
    }else{state=d||{};cache();refresh()}
    stat("불러옴");
  }catch(e){if(seq===reqSeq)stat("서버 연결 실패, 이 브라우저 기록 표시 중",1)}
}

const sections=Object.keys(RAW).map(n=>({n:+n,cols:RAW[n].map(s=>s.split(",").map(p=>p.trim().split(/\s+/).map(Number)))}));
const sig=s=>JSON.stringify(s.cols);
const firstSig={};
sections.forEach(s=>{const k=sig(s);if(firstSig[k]==null)firstSig[k]=s.n;else s.dupOf=firstSig[k]});

const grid=document.getElementById("grid");
function ptId(n,c,r){return n+"-"+c+"-"+r}
function render(){
  grid.innerHTML="";
  sections.forEach(s=>{
    const card=document.createElement("section");card.className="card";card.id="sec-"+s.n;
    const rows=Math.max(...s.cols.map(c=>c.length));
    let h=`<h2><span>${s.n}번${s.dupOf?` <span class="dup">(${s.dupOf}번과 동일)</span>`:""}</span><span class="acts"><span class="chip" data-chip></span><button type="button" data-all>전체</button></span></h2><div class="scroll"><table><thead><tr>`;
    s.cols.forEach((_,ci)=>{h+=`<th class="c${ci?" sep":""}"></th><th>X</th><th>Y</th>`});
    h+="</tr></thead><tbody>";
    for(let r=0;r<rows;r++){
      h+="<tr>";
      s.cols.forEach((col,ci)=>{
        const p=col[r];const sep=ci?" sep":"";
        if(!p){h+=`<td class="c${sep}"></td><td></td><td></td>`;return}
        const id=ptId(s.n,ci,r);
        h+=`<td class="c${sep}" data-id="${id}"><input type="checkbox" id="cb-${id}" aria-label="${s.n}번 X ${p[0]} Y ${p[1]}"></td><td class="pt" data-id="${id}">${p[0]}</td><td class="pt" data-id="${id}">${p[1]}</td>`;
      });
      h+="</tr>";
    }
    h+="</tbody></table></div>";
    card.innerHTML=h;
    grid.appendChild(card);
  });
  refresh();
}
function refresh(){
  let tot=0,done=0;
  sections.forEach(s=>{
    const card=document.getElementById("sec-"+s.n);
    let t=0,d=0;
    s.cols.forEach((col,ci)=>col.forEach((_,r)=>{
      const id=ptId(s.n,ci,r),on=!!state[id];t++;if(on)d++;
      card.querySelector("#cb-"+CSS.escape(id)).checked=on;
      card.querySelectorAll(`[data-id="${id}"]`).forEach(el=>el.classList.toggle("on",on));
    }));
    card.querySelector("[data-chip]").textContent=d+" / "+t;
    card.querySelector("[data-all]").textContent=d===t?"해제":"전체";
    card.classList.toggle("complete",d===t);
    tot+=t;done+=d;
  });
  document.getElementById("totalNum").textContent=`${done} / ${tot} (${tot?Math.round(done/tot*100):0}%)`;
  document.getElementById("totalBar").style.width=(tot?done/tot*100:0)+"%";
}
grid.addEventListener("click",e=>{
  const allBtn=e.target.closest("[data-all]");
  if(allBtn){
    const n=+allBtn.closest(".card").id.slice(4);const s=sections.find(x=>x.n===n);
    const ids=[];s.cols.forEach((col,ci)=>col.forEach((_,r)=>ids.push(ptId(n,ci,r))));
    const allOn=ids.every(i=>state[i]);
    ids.forEach(i=>mark(i,!allOn));
    refresh();return;
  }
  const cell=e.target.closest("[data-id]");if(!cell)return;
  const id=cell.dataset.id;
  if(e.target.matches("input[type=checkbox]"))mark(id,e.target.checked);
  else mark(id,!state[id]);
  refresh();
});
const hide=document.getElementById("hideDone");
try{hide.checked=localStorage.getItem(KEY+".hide")==="1"}catch(e){}
document.body.classList.toggle("hide-done",hide.checked);
hide.addEventListener("change",()=>{document.body.classList.toggle("hide-done",hide.checked);try{localStorage.setItem(KEY+".hide",hide.checked?"1":"0")}catch(e){}});
const rb=document.getElementById("resetAll");let armed=null;
rb.addEventListener("click",()=>{
  if(!armed){rb.textContent="한 번 더 누르면 초기화";armed=setTimeout(()=>{armed=null;rb.textContent="전체 초기화"},3000);return}
  clearTimeout(armed);armed=null;rb.textContent="전체 초기화";
  state={};pending={};clearTimeout(timer);cache();refresh();
  if(DB_URL)fetch(dbUrl(),{method:"DELETE"}).then(r=>stat(r.ok?"초기화됨":"초기화 실패",!r.ok)).catch(()=>stat("초기화 실패",1));
});
const nickIn=document.getElementById("nick");
document.getElementById("nickForm").addEventListener("submit",e=>{
  e.preventDefault();
  const n=nickIn.value.trim();
  if(!n){stat("닉네임을 입력하세요",1);nickIn.focus();return}
  if(/[.#$\[\]\/]/.test(n)){stat("닉네임에 . # $ [ ] / 는 쓸 수 없습니다",1);return}
  if(!isEmpty(pending))flush();
  load(n);
});
// 다른 기기에서 바꾼 내용을 탭으로 돌아올 때 반영
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&nick&&DB_URL&&isEmpty(pending))load(nick);
});
render();
const lastNick=lsGet(NICK_KEY);
if(lastNick){nickIn.value=lastNick;load(lastNick)}
</script>
</body>
</html>
